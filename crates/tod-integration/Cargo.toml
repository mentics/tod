[package]
name = "tod-integration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tod_integration"
path = "src/lib.rs"

# Leaf crate: no `tod-*` dependencies by design.
# Defines the DataSource trait and data-source implementations (Linear, etc.).
# Transport and API code for external services lives here, not in tod-agent
# (which is exclusively for agent transport).
[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
reqwest-middleware = "0.3"
reqwest-retry = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt"] }
