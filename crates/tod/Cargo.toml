[package]
name = "tod"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
