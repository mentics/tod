[package]
name = "tod-relay"
version = "0.1.0"
edition = "2024"
description = "The one server tod runs inside a cloud sandbox: commands, terminals, and agents over WebSockets."

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "process", "macros", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
