[package]
name = "tod-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tod_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
fs2 = "0.4"
notify = "8.0"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
tod-agent = { path = "../tod-agent" }
tod-store = { path = "../tod-store" }
tracing = "0.1"
tracing-appender = "0.2"
tracing-rolling-file = { version = "0.1.3", features = ["non-blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4"] }
