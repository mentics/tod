[package]
name = "tod-agentd"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tod-agentd"
path = "src/main.rs"

# The resident daemon (`doc/agentd.md`). The library is what `tod` and
# `tod-cli` link to find, start, and talk to it, so it stays small: no GPUI,
# no agent transport.
[dependencies]
anyhow = "1.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
