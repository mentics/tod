[package]
name = "tod-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tod_agent"
path = "src/lib.rs"

# Deliberately a leaf crate: no `tod-*` dependencies.
# It knows how to hold conversations and sessions with agents across platforms
# (Cursor, Claude) and environments (host shell, container, cloud). It must not
# learn about paths, settings resolution, process docs, or persistence — those
# are decisions `tod-core` makes and `tod-store` records.
[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
