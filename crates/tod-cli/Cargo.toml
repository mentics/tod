[package]
name = "tod-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "tod-cli"
path = "src/main.rs"

# No GPUI and no agent transport: this binary is shelled out to repeatedly by
# agents, so startup cost matters.
[dependencies]
tod-problems = { path = "../tod-problems" }
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tod-core = { path = "../tod-core" }
tod-sandbox = { path = "../tod-sandbox" }
tod-store = { path = "../tod-store" }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
