# UI style guide — source of truth for how the UI looks.

scope:
  in:
    - "named looks (styles, states, tokens) and how an element looks in each UI state"
    - "placement relative to the element it is attached to"
    - "text form: casing, length, punctuation, word order, wrapping, truncation"
  out:
    - "which elements a screen has, where they go, and when they are shown"
    - "which style to use in which situation"
    - "what an interaction does"
    - "the actual words"

styles:
  # Text
  text:
    font: body
    color: text
    overflow: wrap
  text-muted:
    extends: text
    color: text-muted
  text-dense:
    extends: text
    font: dense
  text-dense-muted:
    extends: text-dense
    color: text-muted
  text-title:
    extends: text
    font: title
    overflow: truncate-end
    text-case: sentence
    text-end: no-period
    text-separator: em-dash
  text-page-title:
    extends: text-title
    font: page-title
  text-error:
    extends: text-dense
    color: danger
  text-link:
    extends: text
    color: link

  # Buttons
  button:
    font: control
    color: text
    background: control-fill
    border: control-edge
    radius: control
    height: control
    padding-x: control
    gap: related
    overflow: single-line
    text-case: sentence
    text-max-words: 3
    text-starts-with: verb
    text-end: no-period
    icon: icon-set
    hover: hover-control
    disabled: disabled
  button-primary:
    extends: button
    color: primary-text
    background: primary
    border: primary
    hover: hover-primary
  button-ghost:
    extends: button
    background: none
    border: none
    hover: hover-ghost
  button-danger:
    extends: button
    color: danger
    background: danger-fill
    border: danger-fill
    hover: hover-danger
  # A button that is on or off (e.g. a filter). Off looks like a quiet outlined
  # button; on must be unmistakable at a glance: solid accent fill, bright edge,
  # bold text.
  button-toggle:
    extends: button-small
    color: text-muted
    background: none
    border: control-edge
    hover: hover-control
    selected: toggle-on
  button-small:
    font: body
    height: control-small
    padding-x: related
    gap: inline
  button-xsmall:
    font: dense
    height: control-xsmall
    padding-x: inline
    gap: inline

  # Badges
  badge:
    font: dense-medium
    color: text
    background: badge-fill
    border: badge-edge
    radius: badge
    padding-x: snug
    padding-y: hairline
    overflow: single-line
  shortcut-badge:
    extends: badge
    anchor: bottom-right of target
    target-reserve-bottom: overhang-y
    target-reserve-right: overhang-x

  # Panels
  panel:
    background: surface
  panel-header:
    padding-x: inset
    padding-y: related
    gap: related
    border-bottom: divider
  panel-title:
    extends: text-title
  panel-body:
    padding: inset
    gap: related
    scrollbar: always-visible
  panel-body-roomy:
    extends: panel-body
    padding: section
  panel-footer:
    padding-x: inset
    padding-y: related
    gap: related
    border-top: divider
  pane:
    min-width: pane-min
  pane-divider:
    background: divider
    dragging: dragging
  section:
    gap: section
  empty-message:
    extends: text-muted
    align: center

  # Rows and fields
  row:
    font: body
    radius: control
    padding-x: related
    padding-y: inline
    gap: inline
    overflow: truncate-end
    hover: hover-row
    highlighted: highlighted
  row-wrapped:
    extends: row
    overflow: wrap
  field:
    radius: control
    hover: hover-row
    highlighted: highlighted
  field-label:
    extends: text-dense-muted
    text-case: sentence
    text-end: no-period
  menu-item:
    extends: row
    hover: hover-menu
    highlighted: hover-menu

  # Lists: one flat run of item rows under headings that group them. `row`
  # above is the item; these are the list around it. Grouping goes as many
  # levels as a list needs, each level one step lighter and one step further
  # in than the one above it.
  list-group:
    font: title
    height: group-row
    padding-x: related
    gap: inline
    border-bottom: divider-strong
    overflow: truncate-end
    hover: hover-row
    highlighted: highlighted
  # The outermost level reads as a band across the whole list.
  list-group-outer:
    extends: list-group
    font: title-bold
    background: group-band
  # Every level below the second.
  list-group-inner:
    extends: list-group
    font: title-medium
  # The count of items under a heading, appended to its label as "(n)".
  list-group-count:
    extends: text-muted
  # The chevron that collapses a group, in the heading's leading gutter.
  list-group-chevron:
    extends: text-dense-muted
    width: control-xsmall

  # Chunks: a block of content under a header that expands and collapses
  chunk:
    border: divider
    radius: control
  chunk-header:
    font: dense
    radius: control
    padding-x: related
    padding-y: inline
    gap: inline
    overflow: truncate-end
    icon: icon-set
    hover: hover-row
    highlighted: highlighted
  chunk-label:
    extends: text-dense-muted
    text-case: sentence
    text-end: no-period
  chunk-body:
    padding-x: related
    padding-bottom: related
  chunk-children:
    padding-left: section

  # Overlays and notices
  toast:
    background: surface
    border: divider
    radius: floating
    shadow: floating
    padding-x: section
    padding-y: inset
    gap: inline
    min-width: toast-min
    max-width: toast-max
  toast-title:
    extends: text
    font: title
    text-case: sentence
    text-end: no-period
  toast-error:
    extends: toast
    color: on-danger-strong
    background: danger-strong
    border: none
  toast-warning:
    extends: toast
    color: warning-text
    background: warning-fill
    border: none
    icon-color: warning-icon
    min-width: toast-narrow-min
    max-width: toast-narrow-max
  banner-notice:
    color: notice-text
    background: notice-fill
    padding-x: section
    padding-y: related
    gap: related
    border-bottom: divider
  callout-stale:
    color: stale-text
    background: stale-fill
    border: stale-edge
    radius: control
    padding-x: inset
    padding-y: related
    gap: related
  callout-stale-title:
    extends: callout-stale
    font: title
    text-case: sentence
    text-end: no-period
  node-title-pending-changes:
    # A tree row whose node has incoming changes it has not been checked
    # against: rare, so it must stand out from every other row.
    extends: text-title
    color: incoming-text
  scrim:
    background: scrim

states:
  hover-control:
    background: control-fill-hover
  hover-primary:
    background: primary-hover
  hover-ghost:
    background: ghost-hover
  hover-danger:
    background: danger-fill-hover
  hover-row:
    background: highlight
  hover-menu:
    background: accent
  highlighted:
    background: highlight
    border: highlight-edge
  dragging:
    background: drag-edge
  disabled:
    color: text-muted
  toggle-on:
    color: text
    background: toggle-on-fill
    border: toggle-on-edge
    font-weight: semibold

properties:
  extends: "styles, comma-separated; later ones override earlier ones"
  font: font token
  color: color token
  background: "color token, or none"
  border: "color token, or none; width size.border"
  border-top: "color token; width size.border"
  border-bottom: "color token; width size.border"
  icon-color: color token
  radius: radius token
  shadow: shadow token
  padding: space token, all sides
  padding-x: space token
  padding-y: space token
  padding-left: "space token; a list heading adds size.group-indent per level"
  padding-bottom: space token
  gap: space token
  height: size token
  width: size token
  min-width: size token
  max-width: size token
  align: "left | center | right"
  anchor: "<corner> of target"
  target-reserve-bottom: space token the target leaves free below its content
  target-reserve-right: space token the target leaves free right of its content
  scrollbar: "always-visible"
  overflow: "wrap | truncate-end (ellipsis) | single-line (no wrap, no ellipsis)"
  text-case: "sentence"
  text-max-words: number
  text-starts-with: "verb"
  text-end: "no-period"
  text-separator: "em-dash (\"Surface — Subject\")"
  icon: "icon-set (never unicode symbols)"
  hover: state
  highlighted: state
  disabled: state
  selected: state
  font-weight: "regular | semibold"
  dragging: state

tokens:
  color:
    surface: "#0a0a0a"
    text: "#fafafa"
    text-muted: "#a3a3a3"
    divider: "#262626"
    control-fill: "#2f2f2f4d"
    control-fill-hover: "#2f2f2f80"
    control-edge: "#2f2f2f"
    primary: "#fafafa"
    primary-text: "#171717"
    primary-hover: "#e2e2e2"
    ghost-hover: "#404040cc"
    danger: "#f87171"
    danger-fill: "#f8717133"
    danger-fill-hover: "#f871714d"
    danger-strong: "#ff0000"
    on-danger-strong: "#ffffff"
    warning-fill: "#3a2c2c"
    warning-icon: "#f0a0a0"
    warning-text: "#d9d9d9"
    stale-fill: "#f9731626"
    stale-edge: "#f97316"
    stale-text: "#fdba74"
    incoming-text: "#facc15"
    notice-fill: "#ffff00"
    notice-text: "#000000"
    badge-fill: "#262626"
    badge-edge: "#a3a3a38c"
    highlight: "#1e40af33"
    # A group heading's rule, and the band behind an outermost heading.
    divider-strong: "#a3a3a380"
    group-band: "#26262680"
    highlight-edge: "#1d4ed8"
    toggle-on-fill: "#1d4ed8"
    toggle-on-edge: "#93c5fd"
    accent: "#1d4ed88c"
    link: "#fafafa"
    drag-edge: "#fafafaa6"
    scrim: "#00000073"
  font:
    body: 14px, regular
    control: 16px, regular
    dense: 12px, regular
    dense-medium: 12px, medium
    title: 14px, semibold
    title-bold: 14px, bold
    title-medium: 14px, medium
    page-title: 18px, semibold
  space:
    hairline: 2px
    inline: 4px
    snug: 6px
    related: 8px
    control: 10px
    inset: 12px
    section: 16px
    overhang-x: 2px
    overhang-y: 14px
  size:
    border: 1px
    control: 32px
    control-small: 24px
    control-xsmall: 20px
    pane-min: 320px
    group-row: 28px
    group-indent: 16px
    # Tallest a summary card's list grows before it scrolls.
    summary-list-max: 240px
    toast-min: 240px
    toast-max: 480px
    toast-narrow-min: 280px
    toast-narrow-max: 360px
  radius:
    badge: 2px
    control: 6px
    floating: 8px
  shadow:
    floating: "0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a"
