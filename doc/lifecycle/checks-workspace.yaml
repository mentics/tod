# Checks for the Cofactr workspace (flagship, kb, ui), mirroring their CI.
# Import once: select the workspace node, open its Lifecycle config, press
# "Import / export checks", paste this file, Apply. Every node below inherits
# it; a repository's rows run only when that repository changed on the branch.
#
# One list, used for both phases that run it: `review` (gates the move to the
# PR) and `pr_draft` (reruns after the PR agent pushes). Commands stay on one
# line: the editor's fields are one line.
#
# Not here: the test suites and `makemigrations --check` (they need docker
# compose and databases), browserExtension's eslint/prettier (add if touched),
# and the PR automation workflows (they only exist once a PR does).
review: &checks
  # flagship (Python, ruff + basedpyright)
  - label: ruff check
    command: uv run ruff check --no-fix .
    dir: flagship
  - label: ruff format
    command: uv run ruff format --check --diff .
    dir: flagship
  - label: quality ratchet
    command: python3 scripts/check_quality_ratchet.py
    dir: flagship
  - label: basedpyright
    command: 'uv sync --frozen && b=$(mktemp) && cp .basedpyright/baseline.json "$b" && NODE_OPTIONS=--max-old-space-size=8192 uv run --no-sync basedpyright --baselinemode=auto && { cmp -s "$b" .basedpyright/baseline.json || { echo "basedpyright shrank the baseline: commit the updated .basedpyright/baseline.json"; false; }; }'
    dir: flagship
  - label: migration conflicts
    command: python3 scripts/check_migration_conflicts.py .
    dir: flagship
  - label: test manifest
    command: python3 scripts/ci/check_test_manifest.py
    dir: flagship

  # kb (Python; CI checks changed files only, so these do too)
  - label: lock fresh
    command: uv lock --check
    dir: kb
  - label: ruff format
    command: uv run ruff format --config ruff.toml --check $TOD_CHANGED_FILES
    dir: kb
    pattern: "*.py"
  - label: ruff check
    command: uv run ruff check --config ruff.toml --ignore E501 $TOD_CHANGED_FILES
    dir: kb
    pattern: "*.py"
  - label: pyright
    command: uv sync --locked --all-packages && uv run pyright $TOD_CHANGED_FILES
    dir: kb
    pattern: "*.py"

  # ui (TypeScript; install first with `pnpm install --frozen-lockfile`)
  - label: storybook metadata
    command: pnpm verify-storybook
    dir: ui
  - label: format
    command: pnpm exec vp fmt --check
    dir: ui
  - label: lint
    command: pnpm exec vp lint --max-warnings=0
    dir: ui
  - label: tsc
    command: NODE_OPTIONS=--max-old-space-size=6144 pnpm exec tsc --noEmit
    dir: ui
pr_draft: *checks
