[workspace]

[package]
name = "tod-zgx"
version = "0.0.0"
edition = "2024"
publish = false

[features]
live = ["dep:tod-store"]
agent-socket = ["zgx-script/inspect"]

[dependencies]
tod-agent = { path = "../../crates/tod-agent" }
tod-palette = { path = "../../crates/tod-palette" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tod-core = { path = "../../crates/tod-core" }
tod-store = { path = "../../crates/tod-store", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zgx = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
zgx-desktop = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7", default-features = false, features = ["i18n", "svg", "png"] }

[build-dependencies]
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7", default-features = false }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
winit = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
accesskit_macos = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
accesskit_consumer = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
accesskit_atspi_common = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
accesskit_unix = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
accesskit_windows = { git = "https://github.com/zeronsh/zgx", rev = "b8f298b6b9d1a363adf9e21655334a6e260dc4c7" }
